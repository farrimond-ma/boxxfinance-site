<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/favicon.png?v=3" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="max-image-preview:large" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Only the two families the site actually uses: Outfit (headings) and Inter
       (body), per --font-heading / --font-body in src/index.css. Baloo 2 and
       Fredoka were requested here and referenced nowhere.
       Loaded non-blocking (preload + onload swap): a normal stylesheet link
       here blocks the first paint on the network round trip to Google, which
       PSI measured at ~1.5s on mobile. display=swap means text still paints
       immediately in the fallback face. -->
  <link rel="preload" as="style"
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap"
    onload="this.onload=null;this.rel='stylesheet'">
  <noscript>
    <link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap">
  </noscript>
  <!-- Per-page <title> is rendered by each route's SEO component (React 19 hoists it here) -->

  <!-- Meta Pixel Code -->
  <script>
    // Standard Meta snippet, with ONE change: the fbevents.js <script> is
    // injected on window load instead of immediately. The pixel pulls ~178KB
    // (fbevents.js + two config requests) and on a throttled phone that
    // competes for bandwidth with the CSS and hero image the first paint
    // needs — it was the heaviest thing on the page after our own bundle.
    // Nothing is lost: the stub below still defines fbq and queues calls, so
    // init/PageView (and Lead, fired later by the forms) replay in order as
    // soon as the real script arrives.
    !function (f, b, e, v, n, t, s) {
      if (f.fbq) return; n = f.fbq = function () { n.callMethod ?
        n.callMethod.apply(n, arguments) : n.queue.push(arguments) };
      if (!f._fbq) f._fbq = n; n.push = n; n.loaded = !0; n.version = '2.0';
      n.queue = [];
      f.addEventListener('load', function () {
        t = b.createElement(e); t.async = !0;
        t.src = v; s = b.getElementsByTagName(e)[0];
        s.parentNode.insertBefore(t, s);
      });
    }(window, document, 'script',
      'https://connect.facebook.net/en_US/fbevents.js');
    fbq('init', '3452187911622354');
    fbq('track', 'PageView');
  </script>
  <noscript><img height="1" width="1" style="display:none"
    src="https://www.facebook.com/tr?id=3452187911622354&ev=PageView&noscript=1"
  /></noscript>
  <!-- End Meta Pixel Code -->
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
