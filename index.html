<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <!-- v=4: the icon dropped from 22KB (a 1080x1080 image for a 16px slot) to
       1.9KB, and the old bytes were still being served under ?v=3. -->
  <link rel="icon" type="image/png" href="/favicon.png?v=4" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="max-image-preview:large" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Only the two families the site actually uses: Outfit (headings) and Inter
       (body), per --font-heading / --font-body in src/index.css. Baloo 2 and
       Fredoka were requested here and referenced nowhere.
       Loaded non-blocking (preload + onload swap): a normal stylesheet link
       here blocks the first paint on the network round trip to Google, which
       PSI measured at ~1.5s on mobile. display=swap means text still paints
       immediately in the fallback face. -->
  <link rel="preload" as="style"
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap"
    onload="this.onload=null;this.rel='stylesheet'">
  <noscript>
    <link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap">
  </noscript>
  <!-- Per-page <title> is rendered by each route's SEO component (React 19 hoists it here) -->

  <!-- Meta Pixel Code -->
  <script>
    // Standard Meta snippet, loaded immediately — do NOT defer it to window
    // load. That was tried on 2026-09-16 to stop its ~178KB competing for a
    // phone's bandwidth, and measured worse: the pixel costs ~130ms of
    // main-thread work wherever it runs (desktop 93 with it, 96 with Facebook
    // blocked), and deferring moves that work AFTER first paint, which is
    // exactly the window Total Blocking Time measures. Desktop went 96 -> 87
    // on PSI; mobile gained nothing outside noise. Loading it early gets the
    // work done before first paint, and tracks every visitor rather than only
    // those who stay past load.
    // Skipped in automated browsers (2026-09-19). The build prerenders every
    // page with Puppeteer, which ran this snippet ~650 times per deploy: each
    // one sent a PageView from the build server, inflating Meta's counts, and
    // the inserted fbevents.js <script> tag was then serialised into the
    // prerendered HTML, so live pages shipped a second copy of it. Real
    // browsers do not set navigator.webdriver, so this changes nothing for
    // visitors: the pixel still loads here, before first paint, per the note
    // above.
    if (!navigator.webdriver) {
    !function(f,b,e,v,n,t,s)
    {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
    n.callMethod.apply(n,arguments):n.queue.push(arguments)};
    if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
    n.queue=[];t=b.createElement(e);t.async=!0;
    t.src=v;s=b.getElementsByTagName(e)[0];
    s.parentNode.insertBefore(t,s)}(window, document,'script',
    'https://connect.facebook.net/en_US/fbevents.js');
    fbq('init', '3452187911622354');
    fbq('track', 'PageView');
    }
  </script>
  <noscript><img height="1" width="1" style="display:none"
    src="https://www.facebook.com/tr?id=3452187911622354&ev=PageView&noscript=1"
  /></noscript>
  <!-- End Meta Pixel Code -->
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
