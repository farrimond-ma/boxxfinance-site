name: Sync Backlink Prospects to CRM

on:
  # 8:40 AM UTC = 9:40 AM BST (staggered off :00 to dodge scheduler queueing)
  schedule:
    - cron: '40 8 * * *'

  # "Push of a button" run from the Actions tab
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run — report only, no requests sent to the CRM'
        type: boolean
        required: false
        default: false

jobs:
  sync:
    name: Push backlink prospects to CRM
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: scripts/content-engine
        run: npm install --legacy-peer-deps

      - name: Sync to CRM
        working-directory: scripts/content-engine
        env:
          GOOGLE_CREDENTIALS:  ${{ secrets.GOOGLE_CREDENTIALS }}
          SPREADSHEET_ID:      ${{ secrets.SPREADSHEET_ID }}
          CRM_BACKLINKS_URL:   ${{ secrets.CRM_BACKLINKS_URL }}
          CRM_BACKLINKS_KEY:   ${{ secrets.CRM_BACKLINKS_KEY }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            node sync-backlinks-to-crm.js --dry-run
          else
            node sync-backlinks-to-crm.js
          fi

      - name: Post summary
        if: always()
        run: |
          echo "## Backlink Prospects -> CRM Sync" >> $GITHUB_STEP_SUMMARY
          echo "**Run date:** $(date -u '+%Y-%m-%d %H:%M UTC')" >> $GITHUB_STEP_SUMMARY
          echo "**Triggered by:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
