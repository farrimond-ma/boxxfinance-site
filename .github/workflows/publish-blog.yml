name: Publish Blog
# 2026-08-17: consolidated from 3 separate daily streams (this AM publisher
# running twice a day, a PM publisher running twice a day, and a separate
# trigger-event publisher) down to ONE run, weekdays only — fewer, longer,
# more detailed posts instead of a high-volume queue. The old cadence
# produced near-duplicate articles on the same topic published days apart
# (see the cannibalisation cleanup in git history the same day) because
# nothing checked for existing coverage before queuing a keyword.
#
# publish-blog.js now checks TRIGGER-slot rows first, then AM, then PM (see
# SLOT_PRIORITY in getScheduledRow) — so this single run picks up whichever
# type of content is actually due that day, from any of the old queues.
# publish-blog-pm.yml and publish-blog-trigger.yml are retired (schedule
# removed, workflow_dispatch kept for manual/emergency use).

on:
  schedule:
    # 2026-08-25: back to 2 posts/day, 7 days a week (~14/week) at Mark's
    # request. This is the cadence that produced the 2026-08-17
    # cannibalisation cleanup, so it is only safe because publish-blog.js now
    # runs checkDuplicateCoverage() before generating: any queued row that
    # would duplicate published coverage is skipped and marked "duplicate" in
    # the sheet rather than written. Do NOT raise the cadence further, or
    # remove that guard, without reading the note above it.
    #
    # Word floors were raised to 3000/3200 at the same time — volume without
    # depth is what made the old high-cadence output read as churn.
    - cron: '37 6 * * *'   # 07:37 UK (BST)
    - cron: '37 13 * * *'  # 14:37 UK (BST)
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --legacy-peer-deps
        working-directory: scripts/content-engine

      - name: Run blog publisher
        env:
          GH_TOKEN:          ${{ secrets.GH_PAT }}
          OPENAI_API_KEY:    ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SPREADSHEET_ID:    ${{ secrets.SPREADSHEET_ID }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          YOUTUBE_API_KEY:   ${{ secrets.YOUTUBE_API_KEY }}
          PEXELS_API_KEY:    ${{ secrets.PEXELS_API_KEY }}
          GITHUB_OWNER:      farrimond-ma
          GITHUB_REPO:       boxxfinance-site
          # Comma-separated. Bridging remains the bulk of the queue; the three
          # newer focus services were added 2026-09 when they got their first
          # queued content (add-service-topics.js). Services the site no longer
          # promotes are deliberately absent — the sheet still holds scheduled
          # rows for them, and removing this filter entirely would start
          # publishing invoice finance and the rest again.
          SERVICE_FILTER: "Bridging Finance,Secured Loans,Bad Credit Mortgages,Buy To Let Refinance"
        run: node publish-blog.js
        working-directory: scripts/content-engine
