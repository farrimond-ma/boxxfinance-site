name: Publish Blog
# 2026-08-17: consolidated from 3 separate daily streams (this AM publisher
# running twice a day, a PM publisher running twice a day, and a separate
# trigger-event publisher) down to ONE run, weekdays only — fewer, longer,
# more detailed posts instead of a high-volume queue. The old cadence
# produced near-duplicate articles on the same topic published days apart
# (see the cannibalisation cleanup in git history the same day) because
# nothing checked for existing coverage before queuing a keyword.
#
# publish-blog.js now checks TRIGGER-slot rows first, then AM, then PM (see
# SLOT_PRIORITY in getScheduledRow) — so this single run picks up whichever
# type of content is actually due that day, from any of the old queues.
# publish-blog-pm.yml and publish-blog-trigger.yml are retired (schedule
# removed, workflow_dispatch kept for manual/emergency use).

on:
  schedule:
    # 6:37 AM UTC = 7:37 AM UK time (BST). Weekdays only.
    - cron: '37 6 * * 1-5'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --legacy-peer-deps
        working-directory: scripts/content-engine

      - name: Run blog publisher
        env:
          GH_TOKEN:          ${{ secrets.GH_PAT }}
          OPENAI_API_KEY:    ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SPREADSHEET_ID:    ${{ secrets.SPREADSHEET_ID }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          YOUTUBE_API_KEY:   ${{ secrets.YOUTUBE_API_KEY }}
          PEXELS_API_KEY:    ${{ secrets.PEXELS_API_KEY }}
          GITHUB_OWNER:      farrimond-ma
          GITHUB_REPO:       boxxfinance-site
          SERVICE_FILTER:             Bridging Finance
        run: node publish-blog.js
        working-directory: scripts/content-engine
