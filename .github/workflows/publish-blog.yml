name: Publish Blog
# 2026-08-17: consolidated from 3 separate daily streams (this AM publisher
# running twice a day, a PM publisher running twice a day, and a separate
# trigger-event publisher) down to ONE run, weekdays only — fewer, longer,
# more detailed posts instead of a high-volume queue. The old cadence
# produced near-duplicate articles on the same topic published days apart
# (see the cannibalisation cleanup in git history the same day) because
# nothing checked for existing coverage before queuing a keyword.
#
# publish-blog.js now checks TRIGGER-slot rows first, then AM, then PM (see
# SLOT_PRIORITY in getScheduledRow) — so this single run picks up whichever
# type of content is actually due that day, from any of the old queues.
# publish-blog-pm.yml and publish-blog-trigger.yml are retired (schedule
# removed, workflow_dispatch kept for manual/emergency use).

on:
  schedule:
    # 2026-08-25: back to 2 posts/day, 7 days a week (~14/week) at Mark's
    # request. This is the cadence that produced the 2026-08-17
    # cannibalisation cleanup, so it is only safe because publish-blog.js now
    # runs checkDuplicateCoverage() before generating: any queued row that
    # would duplicate published coverage is skipped and marked "duplicate" in
    # the sheet rather than written. Do NOT raise the cadence further, or
    # remove that guard, without reading the note above it.
    #
    # Word floors were raised to 3000/3200 at the same time — volume without
    # depth is what made the old high-cadence output read as churn.
    #
    # 2026-09: three runs a day — two bridging, one focus-service. The third
    # run exists so the newer services (secured loans, bad credit mortgages,
    # buy to let refinance) get published output without taking a slot from
    # bridging, which remains the priority. Each run is pinned to its own
    # SERVICE_FILTER below via github.event.schedule, so the two streams
    # cannot consume each other's slot. Changing a cron time here means
    # changing the matching time in that expression.
    - cron: '37 6 * * *'   # 07:37 UK (BST) — bridging
    - cron: '37 13 * * *'  # 14:37 UK (BST) — bridging
    - cron: '37 18 * * *'  # 19:37 UK (BST) — secured loans / bad credit / BTL refinance
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab
    inputs:
      service_filter:
        description: 'Override SERVICE_FILTER (blank = bridging only)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --legacy-peer-deps
        working-directory: scripts/content-engine

      - name: Run blog publisher
        env:
          GH_TOKEN:          ${{ secrets.GH_PAT }}
          OPENAI_API_KEY:    ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SPREADSHEET_ID:    ${{ secrets.SPREADSHEET_ID }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          YOUTUBE_API_KEY:   ${{ secrets.YOUTUBE_API_KEY }}
          PEXELS_API_KEY:    ${{ secrets.PEXELS_API_KEY }}
          GITHUB_OWNER:      farrimond-ma
          GITHUB_REPO:       boxxfinance-site
          # Per-run, not global: the 19:37 run publishes the five non-bridging
          # focus services, the other two publish bridging only — kept
          # deliberately separate (Mark's call, 2026-09) rather than folding
          # Development Finance into the bridging slots. A manual dispatch
          # defaults to bridging unless service_filter is given.
          #
          # Never leave this unset. The sheet still holds scheduled rows for the
          # de-listed services (invoice finance and the rest), and an empty
          # filter means "publish anything", which would start producing them
          # again.
          SERVICE_FILTER: >-
            ${{ github.event.inputs.service_filter != ''
                && github.event.inputs.service_filter
                || (github.event.schedule == '37 18 * * *'
                    && 'Secured Loans,Bad Credit Mortgages,Buy To Let Refinance,Second Charge Mortgages,Development Finance'
                    || 'Bridging Finance') }}
        run: node publish-blog.js
        working-directory: scripts/content-engine
