name: Publish Location

on:
  schedule:
    # 8:09 AM UTC = 9:09 AM UK time (BST). Runs every day. (staggered off :00
    # to dodge scheduler queueing.) Publishes ALL location pages due today or
    # earlier, capped at MAX_PER_RUN, bridging only (SERVICE_FILTER below).
    #
    # 2026-09-03: was paused briefly after it was found to be running daily
    # and reporting SUCCESS while creating nothing — every due row hit the
    # "slug already exists" branch, so the loop finished with published === 0
    # and still exited 0. publish-location.js now exits 1 on published === 0,
    # so a green run means real output; re-enabled on that basis.
    #
    # Five priority towns (Dartford, Fleet, Sevenoaks, Stafford, Airdrie — see
    # docs/secured-loan-cities-research.md) sit at the front of the seeder's
    # city pool. They only reach the sheet once Seed Content Engine runs —
    # its own cron is monthly (1st, 04:20 UTC), so run it manually if these
    # five (or any new rows) are needed sooner than that.
    - cron: '9 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --legacy-peer-deps
        working-directory: scripts/content-engine

      - name: Run location publisher
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          GITHUB_OWNER: farrimond-ma
          GITHUB_REPO: boxxfinance-site
          SERVICE_FILTER: Bridging Finance
        run: node publish-location.js
        working-directory: scripts/content-engine
        timeout-minutes: 30
