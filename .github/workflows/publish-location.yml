name: Publish Location

on:
  # 2026-09-03: schedule disabled. Location publishing is intentionally paused
  # (Mark's call). It was still firing daily and reporting SUCCESS while
  # creating nothing — every due row hit the "slug already exists" branch in
  # publish-location.js, so the run went green with published === 0. A daily
  # green tick for work that isn't happening is worse than no run at all, so
  # the cron is off rather than the failure being left to look like health.
  #
  # To resume: uncomment the cron below, then refill the queue with Populate
  # Content Engine (the seeder's city list was exhausted). publish-location.js
  # now exits 1 when it publishes nothing, so a green run means real output.
  #
  # schedule:
  #   # 8:09 AM UTC = 9:09 AM UK time (BST). Runs every day. (staggered off :00
  #   # to dodge scheduler queueing.) Publishes ALL pages due today or earlier.
  #   - cron: '9 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --legacy-peer-deps
        working-directory: scripts/content-engine

      - name: Run location publisher
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          GITHUB_OWNER: farrimond-ma
          GITHUB_REPO: boxxfinance-site
          SERVICE_FILTER: Bridging Finance
        run: node publish-location.js
        working-directory: scripts/content-engine
        timeout-minutes: 30
