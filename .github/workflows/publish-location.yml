name: Publish Location

# 2026-09-16: schedule removed — Mark's call, "we have enough" location pages
# (370 live). The daily cron had no queue left to work from, so it failed every
# single day on publish-location.js's "published === 0" guard. A job that fails
# daily is worse than no job: it trains everyone to ignore red runs, which is
# how the indexing fault went unnoticed for four months.
#
# Manual runs still work. To restart the stream, seed rows first (Seed Content
# Engine, monthly on the 1st) and add a cron back here — the five priority
# towns in docs/secured-loan-cities-research.md sit at the front of the pool.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --legacy-peer-deps
        working-directory: scripts/content-engine

      - name: Run location publisher
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          GITHUB_OWNER: farrimond-ma
          GITHUB_REPO: boxxfinance-site
          SERVICE_FILTER: Bridging Finance
        run: node publish-location.js
        working-directory: scripts/content-engine
        timeout-minutes: 30
