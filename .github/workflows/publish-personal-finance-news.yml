name: Publish Personal Finance News

# Non-evergreen half of the personal-finance / Google Discover pilot
# (2026-08-20). Deliberately small-scale and separate from the main content
# schedule: checks a few times a day for genuinely new, relevant UK
# consumer property/finance news and publishes AT MOST one reactive article
# when something real is found — most runs will find nothing to publish,
# and that's correct behaviour, not a failure.
#
# The 8 evergreen personal-finance pillars (personal-finance-schedule-90day.xlsx)
# are NOT wired into any workflow yet — Mark asked to start with this
# reactive piece only, see how it performs in Google Search Console's
# Discover report, then decide whether to scale up.

on:
  schedule:
    # 2026-09-16: was 3x/day (~21 news pieces a week) against 3 articles a
    # week, so news outnumbered the commercial content 7:1 — the opposite of
    # what cutting the article cadence was meant to achieve, and news carries
    # the least buying intent. Now 3x/week, matching the article rota, on days
    # that have no article (articles: Mon + Thu bridging, Tue focus services).
    - cron: '15 7 * * 3,5,0'   # Wed/Fri/Sun ~8:15am BST
  workflow_dispatch:
    inputs:
      mode:
        description: 'What to run'
        required: false
        default: 'publish'
        type: choice
        options:
          - publish     # normal: find a story and publish it
          - dry-run     # find + generate an article but do not publish
          - test-gate   # check the relevance gate against 10 known stories
          - check-feeds # list what the keyword pre-filter is currently surfacing

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --legacy-peer-deps
        working-directory: scripts/content-engine

      - name: Run personal finance news publisher
        env:
          GH_TOKEN:          ${{ secrets.GH_PAT }}
          ANTHROPIC_API_KEY:  ${{ secrets.ANTHROPIC_API_KEY }}
          PEXELS_API_KEY:     ${{ secrets.PEXELS_API_KEY }}
          GITHUB_OWNER:       farrimond-ma
          GITHUB_REPO:        boxxfinance-site
        # Scheduled runs have no inputs.mode, so this falls through to the
        # normal publish path with no flag — same as before.
        run: node publish-personal-finance-news.js ${{ github.event.inputs.mode == 'dry-run' && '--dry-run' || github.event.inputs.mode == 'test-gate' && '--test-gate' || github.event.inputs.mode == 'check-feeds' && '--check-feeds' || '' }}
        working-directory: scripts/content-engine
