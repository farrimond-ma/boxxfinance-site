name: Deploy Site

on:
  push:
    branches:
      - main

# Without this, GitHub happily runs multiple deploys in parallel whenever
# commits land close together (very common here — AM/PM/trigger blog
# publishers, social bots and sitemap regen all push through the day).
# Each deploy holds an FTP session open for 5-10 minutes; two overlapping
# deploys mean two simultaneous FTP connections to the same SiteGround
# account, and SiteGround's own connection-limit protection then rejects
# one of them — the "Deploy via FTP" failures traced back to exactly this
# (e.g. one commit triggered two deploy runs 27 seconds apart). Queuing
# deploys one at a time removes the collision instead of just retrying
# into it again. cancel-in-progress stays false — cancelling a deploy
# mid-FTP-upload would leave the live site half-updated, worse than
# waiting.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@v1

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Check blogPosts.json content
        run: head -n 60 src/data/blogPosts.json

      - name: Build site
        env:
          CI: false
          PUPPETEER_EXECUTABLE_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
          CHROME_BIN: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: npm run build

      - name: Show built insights folder
        run: |
          echo "=== DIST ROOT ==="
          ls -la dist
          echo "=== DIST INSIGHTS ==="
          ls -la dist/insights || true
          echo "=== DIST TEST ARTICLE ==="
          ls -la dist/insights/test-article-for-github-publishing || true

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_HOSTNAME }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: dist/
          server-dir: boxxfinance.co.uk/public_html/

      - name: Ping search engines with updated sitemap
        run: |
          curl -s "https://www.google.com/ping?sitemap=https://boxxfinance.co.uk/sitemap.xml" || true
          curl -s "https://www.bing.com/webmaster/ping.aspx?siteMap=https://boxxfinance.co.uk/sitemap.xml" || true
          echo "Search engine sitemap pings sent"
