name: Publish LinkedIn Post

on:
  # Trigger after the site DEPLOY completes — not after the blog publisher.
  # Posting straight after the publisher raced the ~25-minute deploy
  # (prerender + FTP): the link preview's OG image could be scraped before
  # the new page — and its correct heroImage — was actually live, so the
  # post cached whatever the PREVIOUS deploy was serving at that URL. Same
  # class of bug already fixed the same way in seo-audit.yml and
  # publish-facebook.yml. The job-level guard below limits this to deploys
  # that actually shipped a new blog post.
  workflow_run:
    workflows: ["Deploy Site"]
    types:
      - completed

  # Also run on a schedule as a safety net (8:16 AM UTC = 9:16 AM BST — staggered off :00, was colliding with Publish Location's old 8:00 slot)
  schedule:
    - cron: '16 8 * * *'

  # Manual trigger
  workflow_dispatch:

jobs:
  publish-linkedin:
    name: Generate and post to LinkedIn
    runs-on: ubuntu-latest
    # Chained runs: only after a SUCCESSFUL deploy of a new blog post — not
    # after every other deploy (sitemap regen, social-flag commits, etc.)
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && contains(github.event.workflow_run.head_commit.message, 'Publish blog:')) }}
    # Must exceed the random delay step's 90-min maximum or most runs get cancelled
    timeout-minutes: 105

    steps:
      - name: Random delay (vary post timing ±90 min so actual posting hour shifts daily)
        run: sleep $((RANDOM % 5400))

      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: scripts/content-engine
        run: npm install --legacy-peer-deps

      - name: Run LinkedIn publisher
        working-directory: scripts/content-engine
        env:
          ANTHROPIC_API_KEY:           ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN:                    ${{ secrets.GH_PAT }}
          GITHUB_OWNER:                farrimond-ma
          GITHUB_REPO:                 boxxfinance-site
          SERVICE_FILTER:             Bridging Finance
          LINKEDIN_ACCESS_TOKEN_MARK:  ${{ secrets.LINKEDIN_ACCESS_TOKEN_MARK }}
          LINKEDIN_ACCESS_TOKEN_ANDREW: ${{ secrets.LINKEDIN_ACCESS_TOKEN_ANDREW }}
          LINKEDIN_ORG_ID:             ${{ secrets.LINKEDIN_ORG_ID }}
          LINKEDIN_ORG_ACCESS_TOKEN:   ${{ secrets.LINKEDIN_ORG_ACCESS_TOKEN }}
        run: node publish-linkedin.js

      - name: Post summary
        if: always()
        run: |
          echo "## LinkedIn Publisher" >> $GITHUB_STEP_SUMMARY
          echo "**Run date:** $(date -u '+%Y-%m-%d %H:%M UTC')" >> $GITHUB_STEP_SUMMARY
          echo "**Triggered by:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "Reads directly from blogPosts.json â€” no LinkedIn Queue needed" >> $GITHUB_STEP_SUMMARY
