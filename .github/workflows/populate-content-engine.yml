name: Populate Content Engine

on:
  # Manual trigger only. Routine seeding is handled by seed-content-engine.yml,
  # which now runs monthly (2026-08-27) — that comment used to say seeding
  # happened there, but seed-content-engine was itself manual-only and had not
  # run since 9 June, so nothing was refilling the queue at all.
  #
  # Keep this for one-off or non-bridging seeding. Note it can emit rows for
  # services other than Bridging Finance, which SERVICE_FILTER on the
  # publishers will skip silently — check the service column before running it.
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (log what would be added without writing to sheet)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  populate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --legacy-peer-deps
        working-directory: scripts/content-engine

      - name: Populate ContentEngine sheet
        env:
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: node populate-content-engine.js
        working-directory: scripts/content-engine
        timeout-minutes: 5
