name: Publish Facebook Post

on:
  # Trigger after the site DEPLOY completes — not after the blog publisher.
  # Posting straight after the publisher (the previous behaviour) raced the
  # ~25-minute deploy (prerender + FTP): the Facebook post's forced OG
  # re-scrape hit the URL before the new page — and its correct heroImage —
  # was actually live, so Facebook cached whatever the PREVIOUS deploy was
  # serving at that path. Same class of bug already fixed the same way in
  # seo-audit.yml. The job-level guard below limits this to deploys that
  # actually shipped a new blog post.
  workflow_run:
    workflows: ["Deploy Site"]
    types:
      - completed

  # Catch-up runs in case a chained trigger is missed or a post failed earlier
  schedule:
    - cron: '30 11 * * *'  # ~12:30 BST catch-up
    - cron: '42 14 * * *'  # ~3:42 BST catch-up

  # Manual trigger for testing
  workflow_dispatch:

jobs:
  publish-facebook:
    name: Generate and post to Facebook
    runs-on: ubuntu-latest
    # Chained runs: only after a SUCCESSFUL deploy of a new blog post — not
    # after every other deploy (sitemap regen, social-flag commits, etc.)
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && contains(github.event.workflow_run.head_commit.message, 'Publish blog:')) }}
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: scripts/content-engine
        run: npm install --legacy-peer-deps

      - name: Run Facebook publisher
        working-directory: scripts/content-engine
        env:
          ANTHROPIC_API_KEY:           ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN:                    ${{ secrets.GH_PAT }}
          GITHUB_OWNER:                farrimond-ma
          GITHUB_REPO:                 boxxfinance-site
          SERVICE_FILTER:             Bridging Finance
          FACEBOOK_PAGE_ID:            ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN:  ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
        run: node publish-facebook.js

      - name: Post summary
        if: always()
        run: |
          echo "## Facebook Publisher" >> $GITHUB_STEP_SUMMARY
          echo "**Run date:** $(date -u '+%Y-%m-%d %H:%M UTC')" >> $GITHUB_STEP_SUMMARY
          echo "**Triggered by:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "ðŸ“Š [View Queue](https://docs.google.com/spreadsheets/d/${{ secrets.SPREADSHEET_ID }})" >> $GITHUB_STEP_SUMMARY
