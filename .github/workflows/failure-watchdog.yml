name: Failure Watchdog

# Files a GitHub issue whenever a content-engine workflow fails or is
# cancelled — issues trigger email notifications, so failures surface
# immediately instead of sitting as silent red runs in the Actions tab.
# Repeat failures of the same workflow add comments to the open issue
# rather than filing duplicates. Close the issue once fixed.

on:
  workflow_run:
    # 2026-08-20: audited this list against the actual `name:` field of every
    # workflow file — three entries had gone stale and were silently matching
    # nothing (a workflow_run trigger matches on exact name, so a rename
    # elsewhere breaks the watch with no warning). "Publish Blog (1 of 2)" /
    # "(2 of 2)" were retired 2026-08-17 when blog publishing consolidated to
    # a single "Publish Blog" workflow; "Publish Facebook Reel" is actually
    # named "Publish Facebook Reel (PAUSED)"; "Backlink Outreach Monitor"
    # never matched anything — that script has no scheduled workflow at all,
    # it's run manually. Same investigation also found publish-linkedin.js,
    # publish-instagram.js and publish-pinterest.js were swallowing post
    # failures and always exiting 0 (success) regardless — fixed separately,
    # but note for next time: this list being correct only catches failures
    # a script actually *reports* as failures.
    workflows:
      - "Publish Blog"
      - "Publish Blog (Trigger-Event)"
      - "Publish Personal Finance News"
      - "Discover Personal Finance Feeds"
      - "Publish Location"
      - "Publish Facebook Post"
      - "Publish Facebook Reel (PAUSED)"
      - "Publish LinkedIn Post"
      - "Publish LinkedIn News"
      - "Publish Instagram Post"
      - "Publish Pinterest Pin"
      - "Content Engine Health Check"
      - "Deploy Site"
      - "Regenerate Thin Posts"
      - "AI Visibility Check"
      - "Search Console Insights"
      - "Index Coverage"
      - "SME Index Refresh"
      - "Reddit Monitor"
    types:
      - completed

permissions:
  issues: write

jobs:
  alert:
    if: ${{ github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'cancelled' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: File or update watchdog issue
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const { owner, repo } = context.repo;

            // Ensure the label exists (no-op if it already does)
            try {
              await github.rest.issues.createLabel({
                owner, repo, name: 'watchdog', color: 'd73a4a',
                description: 'Auto-filed by the failure watchdog',
              });
            } catch (e) { /* already exists */ }

            const title = `Watchdog: ${run.name} ${run.conclusion}`;
            const line = `${run.conclusion.toUpperCase()}: [run ${run.run_number}](${run.html_url}) — started ${run.created_at} (${run.event})`;

            const { data: issues } = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', labels: 'watchdog', per_page: 50,
            });
            const existing = issues.find(i => i.title === title);

            if (existing) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: existing.number, body: line,
              });
            } else {
              await github.rest.issues.create({
                owner, repo, title, labels: ['watchdog'],
                body: `**${run.name}** did not complete successfully.\n\n${line}\n\n` +
                      `Repeat failures will be added as comments. Close this issue once the cause is fixed.`,
              });
            }
