name: Publish Blog (Trigger-Event)

# RETIRED 2026-08-17 — publishing consolidated to a single weekday run (see
# publish-blog.yml). Trigger-event content seeded by seed-trigger-content.js
# is now checked FIRST by that single run (getScheduledRow's SLOT_PRIORITY
# puts TRIGGER ahead of AM/PM), so it still gets published — just from the
# one consolidated slot rather than a separate daily run. Schedule removed;
# workflow_dispatch kept for manual/emergency use.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --legacy-peer-deps
        working-directory: scripts/content-engine

      - name: Run trigger-event blog publisher
        env:
          GH_TOKEN:          ${{ secrets.GH_PAT }}
          OPENAI_API_KEY:    ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SPREADSHEET_ID:    ${{ secrets.SPREADSHEET_ID }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          YOUTUBE_API_KEY:   ${{ secrets.YOUTUBE_API_KEY }}
          PEXELS_API_KEY:    ${{ secrets.PEXELS_API_KEY }}
          GITHUB_OWNER:      farrimond-ma
          GITHUB_REPO:       boxxfinance-site
          SERVICE_FILTER:    Bridging Finance
          PUBLISH_SLOT:      TRIGGER
        run: node publish-blog.js
        working-directory: scripts/content-engine
