name: Add Focus-Service Topics

# Manual only. Queues the curated launch content in
# src/data/serviceContentTopics.json into ContentEngine as scheduled blog rows —
# supporting articles for the three focus services that had a service page but
# no content behind them (secured loans, bad credit mortgages, buy to let
# refinance).
#
# No schedule: the topic list is hand-written and reviewed, so it only needs
# running after someone edits it. The script is idempotent, so a repeat run
# adds nothing.
#
# These rows publish through the normal Publish Blog run, which means
# publish-blog.yml's SERVICE_FILTER must include their service — it does.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (report what would be queued, write nothing)'
        required: false
        default: 'true'
      slot:
        description: 'Publish slot for the queued rows'
        required: false
        default: 'PM'
        type: choice
        options:
          - PM
          - AM
      service:
        description: 'Limit to one service (blank = all three, interleaved)'
        required: false
        default: ''
        type: choice
        options:
          - ''
          - Secured Loans
          - Bad Credit Mortgages
          - Buy To Let Refinance
      start:
        description: 'First publish date, YYYY-MM-DD (blank = tomorrow)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  queue:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --legacy-peer-deps
        working-directory: scripts/content-engine

      - name: Queue focus-service topics
        env:
          SPREADSHEET_ID:     ${{ secrets.SPREADSHEET_ID }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          GH_TOKEN:           ${{ secrets.GH_PAT }}
          GITHUB_OWNER:       farrimond-ma
          GITHUB_REPO:        boxxfinance-site
        run: |
          node add-service-topics.js \
            ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }} \
            --slot ${{ github.event.inputs.slot || 'PM' }} \
            ${{ github.event.inputs.service != '' && format('--service "{0}"', github.event.inputs.service) || '' }} \
            ${{ github.event.inputs.start != '' && format('--start {0}', github.event.inputs.start) || '' }}
        working-directory: scripts/content-engine
